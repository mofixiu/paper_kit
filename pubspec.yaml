name: paper_kit
description: >-
  A handmade-paper UI kit for Flutter: rubber stamps, tear-off tickets,
  printed receipts, peelable notes, paper planes and an iPhone frame.
version: 0.1.0
homepage: https://kit.mofiyinebo.com
repository: https://github.com/mofixiu/paper_kit
issue_tracker: https://github.com/mofixiu/paper_kit/issues
topics:
  - ui
  - widgets
  - design-system
  - animation
  - theme

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: The paper_kit gallery on cream paper, with a fresh stamp impression.
    path: doc/screenshots/gallery-light.png
  - description: The same gallery on espresso paper.
    path: doc/screenshots/gallery-dark.png
  - description: A torn ticket, a red-pen error, the paper ruler and an unfolded zine.
    path: doc/screenshots/components-light.png
  - description: PaperPhoneFrame showing a small to-do app built from the kit.
    path: doc/screenshots/phone-light.png
